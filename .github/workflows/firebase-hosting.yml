name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - cursor/psoriasis-conference-site-bf05
  workflow_dispatch:

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify Firebase credentials are present
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT repository secret is missing or empty. Add it under Settings > Secrets and variables > Actions > Repository secrets (exact name, full JSON)."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT is present (length: ${#SA} characters)."

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: immunodermatology-masterclass
          channelId: live
